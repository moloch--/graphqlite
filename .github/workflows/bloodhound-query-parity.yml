name: BloodHound-style query parity

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neo4j-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      neo4j:
        # Neo4j 2026.09.0, official multi-architecture image.
        image: neo4j@sha256:d6269a020149934597c8c3df926d080a612796dbbb48861ca9d5b1109cabf0d8
        env:
          NEO4J_AUTH: none
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 256m
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex sqlite3 libsqlite3-dev libcunit1-dev
          python -m pip install angreal==2.9.2 neo4j==5.28.2 pytest
      - name: Build the portable extension
        run: angreal build extension --release
      - name: Run native regression suites
        run: |
          angreal test unit
          angreal test functional
          GQLITE_TCK_PYTHON="$(command -v python)" angreal test tck-harness
          GQLITE_TCK_PYTHON="$(command -v python)" angreal test tck
          scripts/check-tck-baseline.sh
      - name: Compare identical queries and expected results
        env:
          NEO4J_URI: bolt://127.0.0.1:7687
        run: angreal test bloodhound
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bloodhound-query-parity
          path: |
            build/bloodhound-parity.json
            build/tck-results.json
